[workspace]
members = [
    "crates/lib",
    "crates/std-bin",
    "crates/dcs-bios-codegen",
    "crates/generated"
]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
dcs-bios-rs-lib = { path = "crates/lib", version = "0.2.0" }
dcs-bios-rs-generated = { path = "crates/generated", version = "0.2.0" }
